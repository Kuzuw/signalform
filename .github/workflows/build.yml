name: Build Windows installer

# Every push to main builds the Windows installer and publishes it as the GitHub Release
# for the version in package.json (tag v<version>, created automatically).
# Bump "version" in package.json to start a new release; pushes with the same version
# update that release's installer. "Run workflow" in the Actions tab does the same.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'test/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      # Live output libraries are native modules. Each one is optional: if it fails to
      # install or compile, the app still builds and that output shows as unavailable.
      - name: Spout
        continue-on-error: true
        shell: bash
        run: npm install --save-optional "electron-spout@github:reitowo/electron-spout"

      - name: NDI
        continue-on-error: true
        shell: bash
        run: npm install --save-optional grandiose

      - name: Compile native modules for Electron
        shell: bash
        run: |
          if ! npx electron-builder install-app-deps; then
            echo "::warning::A live output module did not compile for Electron and was left out of this build."
            npm uninstall electron-spout grandiose || true
            rm -rf node_modules/electron-spout node_modules/grandiose
          fi

      - name: Build
        shell: bash
        env:
          # Optional code signing. Without these secrets the installer is unsigned and
          # Windows SmartScreen shows a one-time warning.
          CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder --win --x64 --publish never -c.npmRebuild=false

      - name: Report what the installer contains
        shell: bash
        run: |
          R=dist/win-unpacked/resources
          node -e "const a=require('@electron/asar');const l=a.listPackage('$R/app.asar');for(const m of ['electron-spout','grandiose','ffmpeg-static']){console.log('::notice::'+m+(l.some(p=>p.includes('node_modules'+require('path').sep+m+require('path').sep)||p.includes('node_modules/'+m+'/'))?' is bundled':' is NOT bundled'))}"
          find $R -name "*.node" -o -name "ffmpeg.exe" | sed 's|^|::notice::file |'

      - uses: actions/upload-artifact@v4
        with:
          name: Signalform-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Signalform ${{ steps.v.outputs.tag }}
          make_latest: true
          body: |
            Free and open-source audio-reactive visuals for Windows 10 and 11.

            **Download:** `Signalform-Setup-*.exe` below, then run it.

            The installer is not code-signed yet, so Windows SmartScreen may warn on first run: choose **More info** → **Run anyway**.
          files: out/*.exe
