name: Build installers

# Push a tag like v1.0.0 to build and publish a GitHub Release with the installers.
# "Run workflow" in the Actions tab builds them too (downloadable as run artifacts).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # builds separate Apple Silicon (arm64) and Intel (x64) apps
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      # Live output libraries are native modules. Each one is optional: if it fails to
      # install or compile, the app still builds and that output shows as unavailable.
      - name: Syphon (macOS)
        if: matrix.target == 'mac'
        continue-on-error: true
        run: npm install --save-optional node-syphon

      - name: Spout (Windows)
        if: matrix.target == 'win'
        continue-on-error: true
        shell: bash
        run: npm install --save-optional "electron-spout@github:reitowo/electron-spout"

      - name: NDI
        continue-on-error: true
        shell: bash
        run: npm install --save-optional grandiose

      - name: Compile native modules for Electron
        shell: bash
        run: |
          if ! npx electron-builder install-app-deps; then
            echo "::warning::A live output module did not compile for Electron and was left out of this build."
            npm uninstall node-syphon electron-spout grandiose || true
            rm -rf node_modules/node-syphon node_modules/electron-spout node_modules/grandiose
          fi

      - name: Build
        shell: bash
        env:
          # Optional code signing. Without these secrets the app is ad-hoc signed (macOS)
          # or unsigned (Windows); both run, with a first-launch warning.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          EXTRA="-c.npmRebuild=false"
          if [ -n "$APPLE_ID" ]; then EXTRA="$EXTRA -c.mac.notarize=true"; fi
          if [ "${{ matrix.target }}" = "mac" ]; then
            npx electron-builder --mac --arm64 --publish never $EXTRA
            # the Intel app gets an Intel ffmpeg and Intel native modules
            npm_config_arch=x64 npm rebuild ffmpeg-static
            npx electron-builder install-app-deps --arch=x64 || echo "::warning::Native modules not rebuilt for Intel"
            npx electron-builder --mac --x64 --publish never $EXTRA
          else
            npx electron-builder --win --x64 --publish never $EXTRA
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Signalform-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Signalform ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Free and open-source audio-reactive visuals for macOS and Windows.

            **Download**
            - **Windows 10/11:** `Signalform-Setup-*.exe`
            - **Mac with Apple Silicon (M1–M4):** `Signalform-*-arm64.dmg`
            - **Mac with Intel:** `Signalform-*-x64.dmg`

            First launch: the builds are not code-signed yet.
            - **macOS:** right-click Signalform in Applications → **Open** → **Open**. If macOS says the app is damaged, run `xattr -cr /Applications/Signalform.app` in Terminal once.
            - **Windows:** on the SmartScreen prompt choose **More info** → **Run anyway**.
          files: |
            out/*.dmg
            out/*.zip
            out/*.exe
