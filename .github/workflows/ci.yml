name: CI

# Checks every push and pull request: source and settings checks, the module reference,
# beat-detection accuracy, and the whole interface clicked through in headless Chromium.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and beat detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source and settings checks
        run: node --no-warnings scripts/check.mjs
      - name: Module reference is up to date
        run: |
          node --no-warnings scripts/gen-modules-doc.mjs
          git diff --exit-code docs/MODULES.md || (echo "::error::docs/MODULES.md is out of date. Run npm run docs:modules." && exit 1)
      - name: Beat detection accuracy (kick and snare F1 ≥ 80%)
        run: MIN_F1=80 node --no-warnings test/onsets-varied.mjs 2001 24
      - name: EffectCraft scripts (analysis export and the Audio Link panel)
        run: node --no-warnings test/effectcraft-scripts.mjs

  plugins:
    name: EffectCraft plug-ins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (C → WebAssembly with clang)
        run: |
          sudo apt-get install -y lld >/dev/null
          plugins/effectcraft/build.sh
      - name: Check the plug-in ABI and compare with the native build
        run: node plugins/effectcraft/test/host.mjs
      - name: Load and render them in EffectCraft's own plug-in host
        run: |
          git clone --depth 1 https://github.com/storytold/effectcraft plugins/effectcraft/effectcraft-src
          cd plugins/effectcraft/host-check
          cargo run --release -- ../dist

  interface:
    name: Interface test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Click through the interface
        run: |
          mkdir -p out
          node test/run-app.mjs out/ 2>&1 | tee out/log.txt || true
          if ! grep -q "problems: none" out/log.txt; then
            # the end of the log as one annotation, readable from the run's summary
            echo "::error title=Interface test::$(tail -n 40 out/log.txt | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: out/
