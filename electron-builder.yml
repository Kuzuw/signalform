appId: app.signalform.desktop
productName: Signalform
copyright: Copyright © 2026 Signalform
directories:
  output: dist
  buildResources: build
files:
  - main/**/*
  - renderer/**/*
  - package.json
  - "!**/*.map"
asarUnpack:
  - "**/*.node"
  - "**/node_modules/ffmpeg-static/**"
npmRebuild: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Signalform-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Signalform
