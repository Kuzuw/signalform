<!doctype html>
<meta charset="utf-8">
<style>body{margin:0;background:#000}canvas{display:block;width:640px;height:360px;margin:0 0 8px}</style>
<script type="module">
// Renders the modules named in ?m=a,b,c on 1280×720 canvases, with the demo beat driving them.
import { MODULES, defaults } from '../../renderer/modules/index.js';
import { AudioEngine } from '../../renderer/audio.js';
const q = new URLSearchParams(location.search);
const list = q.get('m').split('|').map((spec) => {
  const [id, json] = spec.split('~');
  return { mod: MODULES.find((m) => m.id === id), over: json ? JSON.parse(decodeURIComponent(json)) : {} };
});
const eng = new AudioEngine();
const pending = [];
let last = performance.now(), t0 = last;
// analysis runs at a steady 60 Hz even when drawing is slow, so beats are never missed
setInterval(() => { const now = performance.now(); const F = eng.update(Math.min(0.05, (now - last) / 1000), (now - t0) / 1000); last = now; pending.push(...F.onsets.map((o) => ({ ...o }))); }, 16);
const inst = list.map(({ mod, over }, i) => {
  const c = document.createElement('canvas'); c.width = 1280; c.height = 720; c.id = 'c' + i; document.body.append(c);
  const params = Object.assign(defaults(mod), over);
  return { i: mod.create(c, params), params };
});
window.start = () => eng.useDemo();
let prev = performance.now();
function frame(now) {
  if (window.halt) return;
  const dt = Math.max(0.001, Math.min(0.1, (now - prev) / 1000)); prev = now;
  const F = eng.F; const saved = F.onsets; F.onsets = pending.splice(0);
  for (const x of inst) x.i.render(F, { dt, t: (now - t0) / 1000, W: 1280, H: 720, S: 2, params: x.params });
  F.onsets = saved;
  window.nframes = (window.nframes || 0) + 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.ready = true;
</script>
